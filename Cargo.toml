[package]
name = "spelaiondb-plugin-hive"
description = "HiveServer2's protocol for SpelaionDB: Apache Hive, Spark's Thrift server, Kyuubi and Impala, served as a plugin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/spelaion-dev/spelaiondb-plugin-hive"
publish = false

[lib]
name = "spelaion_driver_hive"

[[bin]]
name = "spelaiondb-plugin-hive"
path = "src/bin/spelaiondb-plugin-hive.rs"

# The contract and the plugin's side of the protocol come from SpelaionDB's repository, by tag
# (ADR-042): they are one workspace there, so one tag pins them together. Moving the tag is how
# this plugin follows a protocol change.
[dependencies]
spelaion-driver-api = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }
spelaion-plugin-sdk = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }
# The same Arrow as SpelaionDB's: batches cross the two unchanged.
arrow = { version = "60", default-features = false }
async-trait = "0.1"
futures-util = "0.3"
# Apache Thrift's runtime. `src/tcliservice.rs` was written by its compiler 0.17.0 (0.25.0's does
# not compile for that file); 0.23 and later bound what a server's lengths may allocate. Its
# default feature `server` is needed only because the generated file holds the server's side.
ordered-float = "3"
thrift = "0.25"
# ring instead of aws-lc-rs: the latter needs CMake and NASM on Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
# The conformance set every plugin runs against its own program (tests/conformance.rs).
spelaion-plugin-host = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }

[lints.rust]
unsafe_code = "forbid"

# What ships is this program: small and without the debugger's tables.
[profile.release]
strip = "symbols"
