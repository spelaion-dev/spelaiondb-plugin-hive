# Apache Impala 4.5.0 for testing this plugin by hand: its quickstart (Apache Impala's
# `docker/quickstart.yml` and `docker/quickstart_conf/hive-site.xml`), trimmed: no Kudu, smaller
# memory, and HiveServer2's port only, on 127.0.0.1:21050, with no authentication (no SASL).
#
#     docker compose -f testing/impala/compose.yaml up -d
#     SPELAION_TEST_IMPALA=127.0.0.1:21050 cargo test
#
# It is not among CI's servers: four services and a metastore, about 7 GB of memory.
name: spelaiondb-plugin-hive-impala

services:
  hms:
    image: apache/impala@sha256:3b6c3eb5efc879ba7a4c3894939822b4faf63581c10a0f7544a6ce8d0cb02424
    # Impala's metastore client refuses an underscore in a host name: a name of its own.
    container_name: quickstart-hive-metastore
    command: ["hms"]
    volumes:
      - warehouse:/var/lib/hive
      - warehouse:/user/hive/warehouse
      - ./quickstart_conf:/opt/hive/conf:ro
    mem_limit: 1g
    networks: [quickstart]
  statestored:
    image: apache/impala@sha256:d1410b4b22c3fcac2c2d1c47180e94f268c5477eb845fbfab2b38ea1aaf75ea9
    command: ["-redirect_stdout_stderr=false", "-logtostderr", "-v=1"]
    volumes:
      - ./quickstart_conf:/opt/impala/conf:ro
    mem_limit: 512m
    networks: [quickstart]
  catalogd:
    depends_on: [statestored, hms]
    image: apache/impala@sha256:f7092eb9deb09d888a4b3eee45c48a336a5700b0340e0cad3072c7e2458bb477
    command: ["-redirect_stdout_stderr=false", "-logtostderr", "-v=1",
              "-hms_event_polling_interval_s=1", "-invalidate_tables_timeout_s=999999"]
    volumes:
      - warehouse:/user/hive/warehouse
      - ./quickstart_conf:/opt/impala/conf:ro
    mem_limit: 1536m
    networks: [quickstart]
  impalad:
    image: apache/impala@sha256:d035b90e1ff2558a6fe14dc0c04f4daafa24c9acefa376a80e74e99020a6d2e4
    depends_on: [statestored, catalogd]
    ports:
      - "127.0.0.1:21050:21050"
    command: ["-v=1", "-redirect_stdout_stderr=false", "-logtostderr",
              "-mt_dop_auto_fallback=true",
              "-default_query_options=mt_dop=2,default_file_format=parquet,default_transactional_type=insert_only",
              "-mem_limit=2gb"]
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx768m
    volumes:
      - warehouse:/user/hive/warehouse
      - ./quickstart_conf:/opt/impala/conf:ro
    mem_limit: 3584m
    networks: [quickstart]

volumes:
  warehouse:

networks:
  quickstart:
    # Compose's own names have an underscore, which the metastore client refuses.
    name: spelaiondb-hive-impala
